
name: DevSecOps - tfsec Scanner

# This workflow will run the tfsec security scanner on your Terraform code whenever there is a push to the main or master branch. It checks for potential security issues in your Terraform configurations and reports them.
on:
  push:
    branches:
      - main
      - master

jobs:
  security_scan:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run tfsec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
